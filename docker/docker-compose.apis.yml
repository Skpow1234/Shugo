services:
  # REST API Service
  shugo-rest-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rest-api
    container_name: shugo-rest-api
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=info
      - SHUGO_AUTH_TOKEN=${SHUGO_AUTH_TOKEN}
    command: ["--port", "8080"]
    volumes:
      - shugo-rest-data:/app/data
    networks:
      - shugo-api-network
    restart: unless-stopped

  # gRPC API Service
  shugo-grpc-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.grpc-api
    container_name: shugo-grpc-api
    ports:
      - "8082:8082"
    environment:
      - LOG_LEVEL=info
      - SHUGO_AUTH_TOKEN=${SHUGO_AUTH_TOKEN}
    command: ["--port", "8082"]
    volumes:
      - shugo-grpc-data:/app/data
    networks:
      - shugo-api-network
    restart: unless-stopped

  # GraphQL API Service
  shugo-graphql-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.graphql-api
    container_name: shugo-graphql-api
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=info
      - SHUGO_AUTH_TOKEN=${SHUGO_AUTH_TOKEN}
    command: ["--port", "8081"]
    volumes:
      - shugo-graphql-data:/app/data
    networks:
      - shugo-api-network
    restart: unless-stopped

  # Bootstrap node 1 - for P2P network
  shugo-node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: shugo-node1
    ports:
      - "3000:3000"
    environment:
      - LOG_LEVEL=info
      - SHUGO_AUTH_TOKEN=${SHUGO_AUTH_TOKEN}
    command: ["--listen", ":3000", "--log-level", "info"]
    volumes:
      - shugo-node1-data:/app/data
    networks:
      - shugo-api-network
    restart: unless-stopped

  # Bootstrap node 2 - for P2P network
  shugo-node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: shugo-node2
    ports:
      - "7000:7000"
    environment:
      - LOG_LEVEL=info
      - SHUGO_AUTH_TOKEN=${SHUGO_AUTH_TOKEN}
    command: ["--listen", ":7000", "--log-level", "info"]
    volumes:
      - shugo-node2-data:/app/data
    networks:
      - shugo-api-network
    restart: unless-stopped

  # Client node - connects to both bootstrap nodes
  shugo-node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: shugo-node3
    ports:
      - "5000:5000"
    environment:
      - LOG_LEVEL=info
      - SHUGO_AUTH_TOKEN=${SHUGO_AUTH_TOKEN}
    command: [
      "--listen", ":5000",
      "--bootstrap", "shugo-node1:3000,shugo-node2:7000",
      "--log-level", "info"
    ]
    volumes:
      - shugo-node3-data:/app/data
    networks:
      - shugo-api-network
    depends_on:
      - shugo-node1
      - shugo-node2
    restart: unless-stopped

volumes:
  shugo-rest-data:
    driver: local
  shugo-grpc-data:
    driver: local
  shugo-graphql-data:
    driver: local
  shugo-node1-data:
    driver: local
  shugo-node2-data:
    driver: local
  shugo-node3-data:
    driver: local

networks:
  shugo-api-network:
    driver: bridge
