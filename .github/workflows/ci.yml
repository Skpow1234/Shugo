name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  security-events: write

env:
  GO_VERSION: "1.24.6"
  GOTOOLCHAIN: auto
  CGO_ENABLED: "1"
  GOLANGCI_LINT_VERSION: v2.1.6

jobs:
  # ---------------------------------------------------------------------------
  # Tier 0 — static checks (fail the PR)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l . | grep -v vendor || true)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$unformatted"
            echo "Fix with: gofmt -s -w ."
            exit 1
          fi

      - name: go mod tidy (drift check)
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum drift detected. Run 'go mod tidy' and commit."
            diff -u go.mod.bak go.mod || true
            diff -u go.sum.bak go.sum || true
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m --config=config/.golangci.yml
          # Prefer official binary install (recommended over goinstall).
          install-mode: binary

      - name: Trailing whitespace (Go/YAML)
        run: |
          if grep -RIn --include='*.go' --include='*.yml' --include='*.yaml' \
              --exclude-dir=.git --exclude-dir=vendor '[[:blank:]]$' .; then
            echo "::error::Trailing whitespace found"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Tier 1 — unit + race (fail the PR)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Unit tests (tests/unit)
        run: go test -count=1 -timeout=10m ./tests/unit/...

      - name: Internal packages (race)
        run: |
          # Websocket package is known-flaky under race in CI; covered softly below.
          pkgs=$(go list ./internal/... | grep -v '/websocket$' || true)
          go test -count=1 -race -timeout=15m $pkgs

      - name: Core package coverage gate
        run: |
          go test -count=1 -coverprofile=core-coverage.out -covermode=atomic \
            ./internal/crypto/... \
            ./internal/storage/... \
            ./internal/transport/p2p/... \
            ./internal/app/fileserver/...
          total=$(go tool cover -func=core-coverage.out | awk '/total:/ {print $3}' | tr -d '%')
          echo "Core coverage: ${total}%"
          # Soft floor — raise as tests expand
          awk -v c="$total" 'BEGIN { if (c+0 < 40) { print "Core coverage below 40%"; exit 1 } }'

      - name: Upload core coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: core-coverage.out
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 1 — critical P2P acceptance (fail the PR)
  # ---------------------------------------------------------------------------
  p2p-e2e:
    name: P2P Replication E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Replication Store-A / Get-B
        env:
          SHUGO_AUTH_TOKEN: demo-auth-token-2024
        run: |
          go test -v -count=1 -timeout=3m \
            ./tests/integration/end-to-end/ \
            -run 'TestReplicationStoreAGetB$'

  # ---------------------------------------------------------------------------
  # Tier 1 — fast API smoke (fail the PR)
  # ---------------------------------------------------------------------------
  api-smoke:
    name: API Smoke (REST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: REST integration (httptest)
        run: go test -v -count=1 -timeout=2m ./tests/integration/rest/...

  # ---------------------------------------------------------------------------
  # Tier 1 — vulnerability gate (fail on known vulns)
  # ---------------------------------------------------------------------------
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan
        run: govulncheck ./...

  # ---------------------------------------------------------------------------
  # Tier 1 — cross-platform build (fail the PR)
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [unit-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build core binaries
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/shugo$(go env GOEXE) ./cmd/shugo
          go build -trimpath -ldflags="-s -w" -o bin/shugo-node$(go env GOEXE) ./cmd/shugo-node
          go build -trimpath -ldflags="-s -w" -o bin/shugo-api$(go env GOEXE) ./cmd/shugo-api
          go build -trimpath -ldflags="-s -w" -o bin/shugo-config$(go env GOEXE) ./cmd/shugo-config

      - name: Smoke --help
        shell: bash
        run: |
          ./bin/shugo-config$(go env GOEXE) -h >/dev/null 2>&1 || ./bin/shugo-config$(go env GOEXE) --help >/dev/null 2>&1 || true

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: bin/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Tier 1 — Docker (fail the PR)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.dev.yml config >/dev/null
          docker compose -f docker-compose.apis.yml config >/dev/null

      - name: Build images
        run: |
          docker build -t shugo-node:ci -f docker/Dockerfile.node .
          docker build -t shugo-demo:ci -f docker/Dockerfile.demo .

      - name: Image smoke (-h exits via flag.Usage)
        run: |
          # Go flag accepts -h / -help and exits 0; timeout guards against accidental listen.
          timeout 15s docker run --rm shugo-node:ci -h
          timeout 15s docker run --rm shugo-demo:ci -h

      - name: Trivy (HIGH/CRITICAL — warn only)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: shugo-node:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

  # ---------------------------------------------------------------------------
  # Tier 2 — soft gates (report, do not block merge by themselves)
  # ---------------------------------------------------------------------------
  integration-soft:
    name: Integration (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Soft suites
        env:
          SHUGO_AUTH_TOKEN: demo-auth-token-2024
        run: |
          set +e
          failed=0
          run_suite () {
            echo "::group::$1"
            go test -v -count=1 -timeout="$2" $3
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::warning::$1 failed (soft)"
              failed=1
            fi
          }
          run_suite "gRPC API" 2m "./tests/integration/grpc/..."
          run_suite "GraphQL API" 2m "./tests/integration/graphql/..."
          run_suite "multi-node" 5m "./tests/integration/multi-node/..."
          run_suite "e2e (all)" 5m "./tests/integration/end-to-end/..."
          run_suite "websocket internal" 2m "./internal/websocket/..."
          # Non-zero marks the soft job failed in the UI; continue-on-error keeps the gate green.
          exit "$failed"

  fuzz:
    name: Fuzz (time-boxed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Fuzz crypto + transport + storage
        run: |
          set +e
          failed=0
          run_fuzz () {
            echo "::group::$1"
            go test -fuzz="$2" -fuzztime=20s "$3"
            rc=$?
            echo "::endgroup::"
            # fuzz exits 1 on find; treat crash/setup failures distinctly via warning
            if [ $rc -ne 0 ]; then
              echo "::warning::$1 exited $rc (soft)"
              failed=1
            fi
          }
          run_fuzz "crypto EncryptDecrypt" FuzzEncryptDecrypt ./tests/fuzz/crypto/
          run_fuzz "transport Decode" FuzzDecode ./tests/fuzz/transport/
          run_fuzz "storage SanitizePath" FuzzSanitizePath ./tests/fuzz/storage/
          exit "$failed"

  security-static:
    name: Security static (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./internal/crypto/... ./internal/storage/... ./internal/transport/... ./internal/app/... || true

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/golang

  benchmarks:
    name: Benchmarks (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [unit-tests]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -benchtime=1s ./internal/crypto/... ./internal/storage/... \
            | tee benchmark.out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: benchmark.out
          retention-days: 7

  docs:
    name: Docs sanity (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Required docs exist
        run: |
          for f in README.md docs/README.md docs/milestones.md docs/deployment.md documentation/ROADMAP.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      - name: No plaintext http:// in README
        run: |
          if grep -n 'http://' README.md | grep -v 'http://localhost'; then
            echo "::warning::Non-localhost http:// links in README"
          fi

  # ---------------------------------------------------------------------------
  # Gate — required jobs must succeed
  # ---------------------------------------------------------------------------
  # Soft jobs are intentionally omitted from needs so the merge gate is not delayed
  # by warn-only suites. Require this check name in branch protection.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - unit-tests
      - p2p-e2e
      - api-smoke
      - vulncheck
      - build
      - docker
    steps:
      - name: Evaluate required jobs
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "unit-tests=${{ needs.unit-tests.result }}"
          echo "p2p-e2e=${{ needs.p2p-e2e.result }}"
          echo "api-smoke=${{ needs.api-smoke.result }}"
          echo "vulncheck=${{ needs.vulncheck.result }}"
          echo "build=${{ needs.build.result }}"
          echo "docker=${{ needs.docker.result }}"

          failed=0
          check() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::Required job failed or skipped: $name ($result)"
              failed=1
            else
              echo "ok: $name"
            fi
          }

          check lint "${{ needs.lint.result }}"
          check unit-tests "${{ needs.unit-tests.result }}"
          check p2p-e2e "${{ needs.p2p-e2e.result }}"
          check api-smoke "${{ needs.api-smoke.result }}"
          check vulncheck "${{ needs.vulncheck.result }}"
          check build "${{ needs.build.result }}"
          check docker "${{ needs.docker.result }}"

          if [ "$failed" -ne 0 ]; then
            echo "CI gate failed"
            exit 1
          fi
          echo "CI gate passed"
